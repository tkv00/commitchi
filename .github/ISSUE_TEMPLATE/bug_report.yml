name: Bug report
description: Report a reproducible problem in Commitchi
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove GitHub tokens, deploy keys, private repository names, and other secrets before submitting.
  - type: input
    id: command
    attributes:
      label: Command or workflow
      description: Which command or scheduled workflow exposed the problem?
      placeholder: npm test
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Commitchi have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include a redacted error message if available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant test output or renderer input. Do not include credentials.
