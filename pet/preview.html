<!doctype html><meta charset="utf-8"><title>COMMITCHI badge preview</title><style>body{margin:0;background:#dce6eb;font:14px system-ui;color:#243244}main{max-width:1140px;margin:24px auto}section{display:grid;grid-template-columns:repeat(2,minmax(560px,1fr));gap:12px}figure{margin:0;padding:12px;background:#fff;border-radius:12px}img{width:100%;image-rendering:pixelated}button{margin:12px 4px 0 0;padding:8px 12px;border:0;border-radius:8px;cursor:pointer}@media(max-width:1150px){section{grid-template-columns:minmax(560px,1fr)}}</style><main><p>Live badge first; demo controls are isolated fixtures.</p><section><figure><figcaption>live · dark</figcaption><img id="live" src="../assets/commitchi.svg" alt="live commitchi"></figure><figure><figcaption>demo · light</figcaption><img id="demo" src="../assets/commitchi-light.svg" alt="demo commitchi"></figure></section><button data-mood="happy">happy</button><button data-mood="hungry">hungry</button><button data-mood="critical">critical</button><button data-mood="dead">dead</button><button data-mood="crown">level 10</button></main><script type="module">import{renderPet}from'./render.mjs';const img=document.querySelector('#demo');const base={owner:'demo',level:3,xp:80,nextLevelXp:120,food:4,health:100,totalCommits:18,streak:4};let spriteDataUri='';fetch('../assets/sprites/commitchi.png').then(r=>r.blob()).then(blob=>new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)})).then(data=>{spriteDataUri=data;});document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{const k=b.dataset.mood,s={...base,mood:k==='crown'?'happy':k,status:k==='dead'?'dead':'alive',level:k==='crown'?10:3,xp:k==='crown'?920:80,nextLevelXp:k==='crown'?1100:120,health:k==='hungry'?66:k==='critical'?32:k==='dead'?0:100,idleDays:k==='dead'?4:k==='critical'?2:k==='hungry'?1:0};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(renderPet(s,{theme:'light',owner:'demo',name:'데모 커밋치',spriteDataUri}));});</script>
